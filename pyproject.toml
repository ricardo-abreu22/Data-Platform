[build-system] # PEP 517/518: The build-system section tells Python how to build the project. Its backend builder to understand
requires = ["hatchling"]
build-backend = "hatchling.build"

[project] # PEP 621: The [project] section is the standardized way to describe a Python project
name = "data_platform"
version = "0.1.0"
description = "Production data platform"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "structlog",
    "httpx",
    "pyarrow",
    "polars",
    "prometheus-client",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app"

[tool.hatch.build.targets.wheel] # como o folder app não é "data_platform" tenho de adicionar esta configuração para duzer ao hatch onde o package está
packages = ["app"]